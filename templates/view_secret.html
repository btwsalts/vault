{% extends "base.html" %}{% block content %}<section class="formpage"><p class="eyebrow">{{ secret.category }}</p><h1>{{ secret.title }}</h1>{% if secret.username %}<p class="muted">Username: {{ secret.username }}</p>{% endif %}<div class="secretvalue"><code id="secret">{{ value }}</code><button type="button" onclick="navigator.clipboard.writeText(document.getElementById('secret').innerText)">COPY</button></div><form method="post" action="{{ url_for('delete_secret',secret_id=secret.id) }}" onsubmit="return confirm('Delete this secret?')"><button class="danger">DELETE SECRET</button></form></section>{% endblock %}
